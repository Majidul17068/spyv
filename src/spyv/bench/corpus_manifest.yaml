# Public agent-codebase corpus.
#
# Selection criteria, fixed BEFORE any repository was measured:
#   1. Public, OSI-licensed, on GitHub.
#   2. Contains agent/LLM prompt surface in Python (CrewAI, LangChain/LangGraph,
#      OpenAI SDK, or a framework-free system prompt).
#   3. Not a fork or a mirror of another entry.
#   4. Not a tutorial repo consisting solely of a single notebook.
#
# Exclusions, also fixed in advance:
#   - Any private, internal, or employer codebase. The corpus is public-only so
#     the number is reproducible by a stranger, and so that no proprietary code
#     is ever measured. This is enforced by construction: only repositories
#     listed here are cloned, and each is fetched from its public URL.
#   - spyv itself, which would be self-measurement.
#
# `sha` is filled in on first fetch and then frozen, so a rerun measures the
# same bytes. An empty sha means "not yet pinned" -- the fetcher records the
# resolved commit and the runner reports it alongside the result.

version: 1
corpus: public-agent-repos-v1

